name: Preview on ready for review

# Vercel skips previews for draft PRs (scripts/vercel-ignore-build.mjs) and
# only builds on pushes. Marking a draft ready pushes nothing, so ask Vercel
# to deploy the branch now; the ignore script then sees a ready PR and builds.
on:
  pull_request:
    types: [ready_for_review]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      # Identifiers, not secrets (from .vercel/project.json)
      VERCEL_PROJECT_ID: prj_1IrUkvLQKriiAUKIq1gQYTJR8Dkd
      VERCEL_TEAM_ID: team_G51O2a5DCl0VPXCYw4D13cS8
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Passed through env rather than inlined, so a branch name can't inject shell
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      REF: ${{ github.event.pull_request.head.ref }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Ask Vercel to deploy the branch
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing the VERCEL_TOKEN secret (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi
          body=$(jq -n \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg org "$OWNER" --arg repo "$REPO" \
            --arg ref "$REF" --arg sha "$SHA" \
            '{name: "what-box", project: $project,
              gitSource: {type: "github", org: $org, repo: $repo, ref: $ref, sha: $sha}}')
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body" \
            | jq '{id, url, readyState}'
