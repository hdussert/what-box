name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # yarn.lock is gitignored, so installs aren't reproducible yet (see BACKLOG.md)
      - run: yarn install
      - run: yarn tsc --noEmit
      # TODO: add `yarn lint` once it works with TypeScript 7 (see BACKLOG.md)
