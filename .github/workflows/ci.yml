name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn tsc --noEmit
      - run: yarn lint
      # Feature branches don't deploy on Vercel, so CI is their build check.
      # env.ts validates these at build time; the build never uses them.
      - run: yarn build
        env:
          JWT_SECRET: ci-placeholder-secret-at-least-32-characters
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BLOB_READ_WRITE_TOKEN: ci-placeholder
          RESEND_API_KEY: ci-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
