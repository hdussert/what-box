<!doctype html>
<!-- Served by sw.js without a network, so it can't load the app's styles or fonts -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>Offline · WhatBox</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
        box-sizing: border-box;
        background: #09090b;
        color: #fafafa;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 20px;
      }
      p {
        margin: 0;
        color: #a1a1aa;
      }
      button {
        margin-top: 12px;
        padding: 8px 16px;
        border: 1px solid #27272a;
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- The lucide "package" icon (ISC license, lucide.dev), as in app/icon.svg -->
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" />
      <path d="M12 22V12" />
      <polyline points="3.29 7 12 12 20.71 7" />
      <path d="m7.5 4.27 9 5.15" />
    </svg>
    <h1>You're offline</h1>
    <p>WhatBox will reload once you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <script>
      window.addEventListener('online', () => location.reload())
    </script>
  </body>
</html>
